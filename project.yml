name: Example
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "15.0"

packages:
  PreviewScreenshots:
    path: .

schemes:
  Example:
    build:
      targets:
        Example: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ExampleTests

targets:
  Example:
    type: application
    platform: macOS
    sources:
      - Example
    resources:
      - Example/Localizable.xcstrings
    dependencies: []
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.app
      INFOPLIST_FILE: Example/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      DEVELOPMENT_TEAM: ""
      CODE_SIGN_STYLE: Automatic
    info:
      path: Example/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: Example
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        NSCalendarsFullAccessUsageDescription: "Example needs access to your calendars to display and manage your events."

  ExampleTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - ExampleTests
    dependencies:
      - target: Example
        link: false
      - package: PreviewScreenshots
        product: PreviewScreenshots
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.example.app.tests
      GENERATE_INFOPLIST_FILE: YES
      ENABLE_TESTABILITY: YES
